<headz class="mainheader">

    <div class="form-group">
        <label for="fruitInput">Add a new name:</label>
        <input type="text" id="fruitInput" placeholder="Enter a Name">
        <div id="errorText"
        class="error-text" style="color: red; display: none;">Please enter a fruit name.</div>
        <hr><button onclick="additem()">Add Name</button>
        <button onclick="deletefirst()">Delete First Name </button>
        <button onclick="deletelast()">Delete Last Name</button>
        <button onclick="deleteindex()">Delete Name by Index</button>
    </hr>
    </div>

    <div class="display-section" id="output">
        Names: <em>None added yet</em>
    </div>

    <script>
        var fruits = [];
        
        function additem() {
            var newItem = document.getElementById("fruitInput").value.trim();
            if (newItem !== "") {
                fruits.push(newItem);
                document.getElementById("output").innerHTML = "<strong>Names:</strong> " + fruits.join(", ");
                document.getElementById("fruitInput").value = "";
                document.getElementById("errorText").style.display = "none";
            } else {
                document.getElementById("errorText").style.display = "block";
            }
        }

        function deletefirst() {
            if (fruits.length > 0) {
                fruits.shift();
                document.getElementById("output").innerHTML = "<strong>Names:</strong> " + (fruits.length > 0 ? fruits.join(", ") : "<em>None added yet</em>");
            }
            else {
                alert("No fruits to delete.");
            }
            
        }
        function deletelast() {
            if (fruits.length > 0) {
                fruits.pop();
                document.getElementById("output").innerHTML = "<strong>Fruits:</strong> " + (fruits.length > 0 ? fruits.join(", ") : "<em>None added yet</em>");
            }
            else {
                alert("No fruits to delete.");
            }
        }
        function deleteindex() {
            var index = prompt("Enter the index of the fruit to delete (starting from 0):");
            if (index !== null) {
                index = parseInt(index);
                if (!isNaN(index) && index >= 0 && index < fruits.length) {
                    fruits.splice(index, 1);
                    document.getElementById("output").innerHTML = "<strong>Fruits:</strong> " + (fruits.length > 0 ? fruits.join(", ") : "<em>None added yet</em>");
                } else {
                    alert("Invalid index. Please enter a valid number between 0 and " + (fruits.length - 1) + ".");
                }
            }
        }
    </script>
