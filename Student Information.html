<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

</head>
<body>

<div >

        <h2>Student Information BSIT 2C</h2>

        <div class="form-group">
            <label for="studentFNameInput">Enter Student First Name:</label>
            <input type="text" id="studentFNameInput" placeholder="Type first name here...">
            <label for="studentLNameInput">Enter Student Last Name:</label>
            <input type="text" id="studentLNameInput" placeholder="Type last name here...">
            <label for="studentAddressInput">Enter Student Address:</label>
            <input type="text" id="studentAddressInput" placeholder="Type address here...">
<div style=margin-top:20px;>
            <label for="studentBirthdayInput">Enter Student Birthday:</label>
<div style=margin-top:20px;>
            <input type="date" id="studentBirthdayInput" placeholder="Type name here...">
<div style=margin-top:20px;>
            <input type="text" id="mgrade" placeholder="Enter Midterm Grade"> <br><br>
            <input type="text" id="fgrade" placeholder="Enter Final Grade"> <br><br>
        </div>
      
 <Dropdown>
        <p>Select Your Program:
            <select id="program">
            <option value="">--Please Select</option>
            <option value="BSIT">BSIT</option>
            <option value="BSBA">BSBA</option>
            <option value="EDUC">EDUC</option>
            <option value="BSA">BSA</option>
            <option value="BSP">BSP</option>
            </select>
        </p>
    </Dropdown>

        <button onclick="displayStudentName()">Submit</button>

        <button onclick="window.location.href='JavaScript2.html'">Next</button>

        <div class="display-section">
            <strong>Displayed Name:</strong>
            <p id="displayNameOutput">No name entered yet.</p>
        </div>
    </div>
 
    <script>
        function displayStudentName() {
            var mgrade = Number(document.getElementById("mgrade").value);
            var fgrade = Number(document.getElementById("fgrade").value);
            var average = (mgrade + fgrade) / 2;
            
            const FnameValue = document.getElementById('studentFNameInput').value;
            const LnameValue = document.getElementById('studentLNameInput').value;
            const AddValue = document.getElementById('studentAddressInput').value;
            const BirthValue = document.getElementById('studentBirthdayInput').value;
            const ProgValue = document.getElementById('program').value;


            if(average=75){
                Remarks="Passed";
            }
else{
    Remarks="Failed";
}



            document.getElementById('displayNameOutput').innerHTML =  
                "<b>First Name: </b>" + FnameValue + "<br>" +
                "<b>Last Name: </b>" + LnameValue + "<br>" +
                "<b>Address: </b>" + AddValue + "<br>" +
                "<b>Birthday: </b>" + BirthValue + "<br>" +      
                "<b>Program: </b>" + ProgValue + "<br>" +

                "<b>Midterm Grade: </b>" + mgrade + "<br>" +
                "<b>Final Grade: </b>" + fgrade + "<br>" +
                "<b>Average: </b>" + average + "<br>"
                "<b> Remarks :</b>" + Remarks;
        }
    </script>
